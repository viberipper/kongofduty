name: nuketown-gates

on:
  push:
  pull_request:

jobs:
  geo-desync-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install server deps (esbuild for the gates)
        run: npm --prefix server install --no-audit --no-fund
      - name: dual-JSON desync gate (client vs server nuketown.json)
        run: npm run check:nuketown
      - name: P0 seat/s guard (esbuild has no typecheck — grep the crash)
        run: npm run check:p0
      - name: dual-JSON desync gate (client vs server dust2.json)
        run: npm run check:dust2
      - name: vault/oob/cache probe
        run: npm run check:probe
      - name: shipment smoke
        run: npm run check:smoke
